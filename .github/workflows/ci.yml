name: CI

on:
  push:
    # `next` is the long-running development branch for v2.0; see
    # docs/V2_ROADMAP.md. Both branches run the full test matrix.
    branches: [master, next]
  pull_request:
    branches: [master, next]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy src/pyiwfm/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # gmsh (pulled in by [dev] -> [mesh]) needs libGLU at load time on Linux.
      - name: Install gmsh runtime deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - run: pip install -e ".[dev]"
      # mypy runs across the full matrix so 3.10–3.14 type errors surface in PR
      # rather than after merge. Cheap to run; rules out version-specific drift.
      - run: mypy src/pyiwfm/
      - run: pytest tests/unit/ -x --tb=short
      - run: pytest tests/unit/ --cov=pyiwfm --cov-report=xml
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      - uses: codecov/codecov-action@v6
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          files: coverage.xml
          # Tag uploads from `next` separately so v2 coverage doesn't
          # mix into v1.x coverage trend on the codecov dashboard.
          flags: ${{ github.ref == 'refs/heads/next' && 'next' || 'master' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - run: pip install -e ".[docs]"
      # -W escalates Sphinx warnings to errors so doc-rot (broken refs,
      # missing modules, malformed RST) fails CI instead of silently shipping.
      - run: sphinx-build -W docs docs/_build

  webapi-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Linux: vtk / gmsh need GLU + GL at load time.
      - name: Install graphics runtime deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1
      - run: pip install -e ".[webapi,dev]"
      - run: pytest tests/unit/test_webapi_smoke.py -v

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache IWFM sample model
        uses: actions/cache@v5
        with:
          path: ~/.cache/pyiwfm/iwfm-2025.0.1747
          key: iwfm-sample-model-2025.0.1747

      - name: Cache IWFM executables
        uses: actions/cache@v5
        with:
          path: ~/.pyiwfm/bin
          key: iwfm-executables-2025.0.1747-linux

      - name: Install gmsh runtime deps
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - run: pip install -e ".[all,dev]"
      - run: pytest tests/integration/ -v --tb=short

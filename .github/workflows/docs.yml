name: Docs

on:
  push:
    # Build docs on the v2 development branch too so docstring drift
    # surfaces during PR review, not at v2.0.0a1 release time. The
    # deploy job below is gated on `master` only — `next` builds verify
    # but don't publish.
    branches: [master, next]
  pull_request:
    branches: [master, next]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa
      - run: pip install -e ".[all,docs,dev]" genbadge[coverage]
      - run: sphinx-build -W docs docs/_build
      - name: Generate coverage badge
        if: github.ref == 'refs/heads/master'
        run: |
          pytest tests/unit/ --cov=pyiwfm --cov-report=xml -x -q
          genbadge coverage -i coverage.xml -o docs/_build/coverage-badge.svg
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master'
        with:
          path: docs/_build

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

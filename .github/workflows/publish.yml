name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install build
      - name: Pin build version to tag (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYIWFM=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build sdist + wheel (wheel built from sdist for version consistency)
        run: python -m build
      - name: Assert sdist and wheel versions match
        run: |
          set -euo pipefail
          ls -1 dist/
          sdist=$(ls dist/pyiwfm-*.tar.gz | head -1)
          wheel=$(ls dist/pyiwfm-*.whl | head -1)
          sdist_ver=$(basename "$sdist" | sed -E 's|^pyiwfm-(.+)\.tar\.gz$|\1|')
          wheel_ver=$(basename "$wheel" | sed -E 's|^pyiwfm-([^-]+)-.*$|\1|')
          echo "sdist version: $sdist_ver"
          echo "wheel version: $wheel_ver"
          if [ "$sdist_ver" != "$wheel_ver" ]; then
            echo "::error::sdist version ($sdist_ver) does not match wheel version ($wheel_ver) — refusing to upload"
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: github.event_name == 'push'
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract version from tag
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Determine if release is stable
        id: stable
        # PEP 440 stable releases match `vMAJOR.MINOR.PATCH` with no suffix.
        # Pre-releases (vX.Y.Za1, vX.Y.Zb2, vX.Y.Zrc1) and dev builds
        # (vX.Y.Z.devN) only get the version-tag; the `:latest` Docker tag
        # stays pinned to the latest stable release so
        # `docker pull <user>/pyiwfm` keeps returning the stable image.
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${GITHUB_REF_NAME} is a stable release; will publish :latest"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${GITHUB_REF_NAME} is a pre-release; skipping :latest"
          fi
      - name: Build Docker tag list
        id: tags
        run: |
          tags="${{ secrets.DOCKERHUB_USERNAME }}/pyiwfm:${{ github.ref_name }}"
          if [ "${{ steps.stable.outputs.is_stable }}" = "true" ]; then
            tags="${tags}
          ${{ secrets.DOCKERHUB_USERNAME }}/pyiwfm:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.number }}
          tags: ${{ steps.tags.outputs.tags }}
